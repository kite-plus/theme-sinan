name: vane
title: Vane
version: 0.2.0
apiVersion: kite/v1
requires: ">=0.1.4 <2.0.0"
description: A documentation theme for product docs, project sites and knowledge bases, drawn on paper in ink. A home page with a kite in its sky, docs in an ordered tree with a table of contents, and news, by day and by night, with nothing loaded from third parties.
author:
  name: Kite
  url: https://github.com/kite-plus
license: Apache-2.0
homepage: https://github.com/kite-plus/theme-vane
tags: [docs, documentation, paper, serif, dark mode]
screenshot: screenshot.webp

capabilities: [static, dynamic]
contentTypes: [post, page]
taxonomies: [tags, categories]

menus:
  - name: main
    label: Header
    description: The links across the top of every page, and in the drawer on a phone. Until the site gives this menu links, the header links under Navigation are shown.

layouts:
  - name: wide
    label: Wide page
    description: Uses the full width, without the docs tree or a table of contents, for a page that is not part of the docs.
    types: [page]

settings:
  - key: brand
    type: section
    label: Brand
    fields:
      - key: logo
        type: image
        label: Logo
        help: Shown before the site title in the header and the footer. An SVG, or a picture about 64 pixels tall, suits it best.
      - key: logo_dark
        type: image
        label: Logo on a dark page
        help: Shown instead of the logo when the page is dark. Left empty, the logo is shown either way.
      - key: show_title
        type: boolean
        label: Show the site title beside the logo
        help: Turn it off when the logo already spells the name.
        default: true
      - key: tagline
        type: string
        label: Subtitle
        help: A few words after the site's name in the title of the home page, as browser tabs, search results and shared links show it.
        placeholder: Docs for my project
      - key: favicon
        type: image
        label: Site icon
        help: Shown in browser tabs and bookmarks. A square picture of at least 64 pixels suits it best.
      - key: share_image
        type: image
        label: Share picture
        help: Shown when a page is shared in a chat or on a social network, unless the page has a cover of its own. A PNG or JPEG 1200 by 630 pixels suits it best.
      - key: accent
        type: color
        label: Accent color
        help: The kite in the sky, the seals, links and the keyboard focus. Buttons stay in ink. At night the theme lightens it by itself.
        default: "#3a66c4"
        options:
          - {value: "#3a66c4", label: Kite blue}
          - {value: "#0f766e", label: Teal}
          - {value: "#6d4fc2", label: Violet}
          - {value: "#b4530e", label: Rust}
      - key: color_scheme
        type: select
        label: Day or night
        help: What a reader sees first. They can still switch with the button in the header.
        default: auto
        options:
          - {value: auto, label: Follow the reader's system}
          - {value: light, label: Day}
          - {value: dark, label: Night}
      - key: texture
        type: boolean
        label: Paper grain
        help: A faint grain over the page, like the fibers of paper.
        default: true

  - key: navigation
    type: section
    label: Navigation
    preview: page
    fields:
      - key: nav
        type: repeat
        label: Header links
        help: Shown while the site's header menu has no links. An address within the site starts with a slash. A link to another site opens in a new tab.
        fields:
          - {key: label, type: string, label: Label, placeholder: Guide}
          - {key: url, type: url, label: Address, placeholder: /introduction/}
      - key: button_label
        type: string
        label: Header button
        help: An ink button at the right end of the header, such as a link to the downloads. Left empty, there is none.
        placeholder: Download
      - key: button_url
        type: url
        label: Header button address
        placeholder: /download/
      - key: sidebar
        type: repeat
        label: Docs tree
        help: The groups of the sidebar and the pages in each, in reading order. A page listed here is drawn with the tree beside it, and its previous and next links follow this order.
        fields:
          - {key: title, type: string, label: Group title, placeholder: Getting started}
          - key: pages
            type: repeat
            label: Pages
            fields:
              - {key: label, type: string, label: Title, placeholder: Introduction}
              - {key: url, type: url, label: Address, placeholder: /introduction/}

  - key: notice
    type: section
    label: Announcement
    fields:
      - key: announcement
        type: boolean
        label: Show an announcement bar
        help: A line above the header on every page, for a release or an event.
        default: false
      - key: announcement_text
        type: string
        label: Text
        placeholder: Version 1.0 is out
        showIf: {announcement: true}
      - key: announcement_link
        type: url
        label: Link
        help: Left empty, the bar is not a link.
        placeholder: /posts/version-1-0/
        showIf: {announcement: true}

  - key: home
    type: section
    label: "Home page: the headline"
    preview: home
    fields:
      - key: badge_text
        type: string
        label: Badge
        help: A short line above the headline, such as news of a release. Left empty, there is none.
        placeholder: The first release is out
      - key: badge_tag
        type: string
        label: Badge tag
        help: A word or a version stamped in the accent color at the start of the badge.
        placeholder: "1.0"
      - key: badge_link
        type: url
        label: Badge link
        help: Left empty, the badge is not a link.
        placeholder: /posts/version-1-0/
      - key: hero_title
        type: text
        label: Headline
        help: Left empty, the site title is used. Each line of it starts a new line in the headline, and words between two asterisks, *like these*, are underlined.
      - key: hero_text
        type: text
        label: Tagline
        help: A sentence or two under the headline. Left empty, the site description is used.
      - key: actions
        type: repeat
        label: Buttons
        help: The first one is the main button, drawn in ink. One that leads to GitHub carries its mark. Left empty, the home page links to the first page of the docs tree.
        fields:
          - {key: label, type: string, label: Label, placeholder: Get started}
          - {key: url, type: url, label: Address, placeholder: /introduction/}
      - key: hero_command
        type: string
        label: Command
        help: A command beside the buttons that a reader can copy, such as the one that installs the product.
        placeholder: npm install my-tool
      - key: hero_art
        type: boolean
        label: Draw a kite in the sky
        help: A paper kite on a string among clouds behind the headline, its string tied down by the buttons; at night a kite that glows under the moon and stars. It takes the accent color.
        default: true

  - key: home_showcase
    type: section
    label: "Home page: the product"
    preview: home
    fields:
      - key: showcase_label
        type: string
        label: Small heading
        help: A few words in red over the title.
        placeholder: Write and read
      - key: showcase_title
        type: string
        label: Title
      - key: showcase_text
        type: text
        label: Text
        help: A sentence or two under the title.
      - key: showcase_image
        type: image
        label: Main picture
        help: A wide screenshot of the product, drawn in a window. On a phone its middle is shown larger. Left empty, the section is left out.
      - key: showcase_image_dark
        type: image
        label: Main picture on a dark page
        help: Left empty, the main picture is shown either way.
      - key: showcase_alt
        type: string
        label: What the main picture shows
        help: Read out to those who cannot see it.
      - key: showcase_image2
        type: image
        label: Second picture
        help: Drawn in a smaller window over a corner of the first, such as what the product makes. Left empty, the first is drawn alone and wide.
      - key: showcase_image2_dark
        type: image
        label: Second picture on a dark page
      - key: showcase_alt2
        type: string
        label: What the second picture shows
      - key: showcase_note
        type: string
        label: Note
        help: A few words written by the second picture, with an arrow to it.
        placeholder: Press Publish
      - key: showcase_note_text
        type: string
        label: Note, second line
        placeholder: and the page is on the site

  - key: home_features
    type: section
    label: "Home page: the features"
    preview: home
    fields:
      - key: features_label
        type: string
        label: Small heading
        help: A few words in red over the title.
        placeholder: Four things
      - key: features_title
        type: string
        label: Title
        placeholder: What it does
      - key: features
        type: repeat
        label: Features
        help: Paper tags hung down the page on one string, each numbered on a seal, with a title, a sentence and a link if it has one. A tag can carry a small sample of what it describes.
        fields:
          - {key: title, type: string, label: Title}
          - {key: text, type: text, label: Text}
          - {key: link, type: url, label: Link}
          - key: sample
            type: select
            label: Sample
            help: A small picture the theme draws under the text.
            default: none
            options:
              - {value: none, label: None}
              - {value: page, label: The head of a page}
              - {value: code, label: A change to a file}
              - {value: tiles, label: Tiles}
              - {value: pictures, label: Two pictures}
          - {key: page_title, type: string, label: Page title, showIf: {sample: page}}
          - {key: page_text, type: string, label: Page summary, showIf: {sample: page}}
          - key: page_chips
            type: repeat
            label: Page labels
            help: The page's categories, tags or address, each with an icon. One starting with a slash is set as code.
            showIf: {sample: page}
            fields:
              - key: icon
                type: select
                label: Icon
                default: none
                options:
                  - {value: none, label: None}
                  - {value: archive, label: Archive}
                  - {value: chart, label: Chart}
                  - {value: code, label: Code}
                  - {value: container, label: Container}
                  - {value: file, label: File}
                  - {value: folder, label: Folder}
                  - {value: git-branch, label: Branch}
                  - {value: github, label: GitHub}
                  - {value: globe, label: Globe}
                  - {value: image, label: Picture}
                  - {value: link, label: Link}
                  - {value: lock, label: Lock}
                  - {value: message, label: Message}
                  - {value: monitor, label: Screen}
                  - {value: moon, label: Moon}
                  - {value: palette, label: Palette}
                  - {value: puzzle, label: Puzzle piece}
                  - {value: rss, label: Feed}
                  - {value: search, label: Search}
                  - {value: sigma, label: Sigma}
                  - {value: sun, label: Sun}
                  - {value: tags, label: Tags}
                  - {value: terminal, label: Terminal}
              - {key: label, type: string, label: Label}
          - {key: code_title, type: string, label: File, placeholder: content/posts/hello/index.md, showIf: {sample: code}}
          - key: code
            type: code
            label: Lines
            help: A line starting with + is drawn as added, and one starting with - as removed.
            showIf: {sample: code}
          - key: tiles
            type: repeat
            label: Tiles
            help: Two to a row, each a label with an icon.
            showIf: {sample: tiles}
            fields:
              - key: icon
                type: select
                label: Icon
                default: none
                options:
                  - {value: none, label: None}
                  - {value: archive, label: Archive}
                  - {value: chart, label: Chart}
                  - {value: code, label: Code}
                  - {value: container, label: Container}
                  - {value: file, label: File}
                  - {value: folder, label: Folder}
                  - {value: git-branch, label: Branch}
                  - {value: github, label: GitHub}
                  - {value: globe, label: Globe}
                  - {value: image, label: Picture}
                  - {value: link, label: Link}
                  - {value: lock, label: Lock}
                  - {value: message, label: Message}
                  - {value: monitor, label: Screen}
                  - {value: moon, label: Moon}
                  - {value: palette, label: Palette}
                  - {value: puzzle, label: Puzzle piece}
                  - {value: rss, label: Feed}
                  - {value: search, label: Search}
                  - {value: sigma, label: Sigma}
                  - {value: sun, label: Sun}
                  - {value: tags, label: Tags}
                  - {value: terminal, label: Terminal}
              - {key: label, type: string, label: Label}
          - {key: picture, type: image, label: First picture, showIf: {sample: pictures}}
          - {key: picture_dark, type: image, label: First picture on a dark page, showIf: {sample: pictures}}
          - {key: picture2, type: image, label: Second picture, showIf: {sample: pictures}}
          - {key: picture2_dark, type: image, label: Second picture on a dark page, showIf: {sample: pictures}}
          - key: pills
            type: repeat
            label: Labels
            help: Drawn beside the pictures in the accent color.
            showIf: {sample: pictures}
            fields:
              - key: icon
                type: select
                label: Icon
                default: none
                options:
                  - {value: none, label: None}
                  - {value: archive, label: Archive}
                  - {value: chart, label: Chart}
                  - {value: code, label: Code}
                  - {value: container, label: Container}
                  - {value: file, label: File}
                  - {value: folder, label: Folder}
                  - {value: git-branch, label: Branch}
                  - {value: github, label: GitHub}
                  - {value: globe, label: Globe}
                  - {value: image, label: Picture}
                  - {value: link, label: Link}
                  - {value: lock, label: Lock}
                  - {value: message, label: Message}
                  - {value: monitor, label: Screen}
                  - {value: moon, label: Moon}
                  - {value: palette, label: Palette}
                  - {value: puzzle, label: Puzzle piece}
                  - {value: rss, label: Feed}
                  - {value: search, label: Search}
                  - {value: sigma, label: Sigma}
                  - {value: sun, label: Sun}
                  - {value: tags, label: Tags}
                  - {value: terminal, label: Terminal}
              - {key: label, type: string, label: Label}

  - key: home_gallery
    type: section
    label: "Home page: pictures"
    preview: home
    fields:
      - key: gallery_label
        type: string
        label: Small heading
        help: A few words in red over the title.
        placeholder: Themes
      - key: gallery_title
        type: string
        label: Title
      - key: gallery_text
        type: text
        label: Text
      - key: gallery
        type: repeat
        label: Pictures
        help: Prints laid on a band of darker paper, two to a row, each with a caption and a link if it has one.
        fields:
          - {key: image, type: image, label: Picture}
          - {key: image_dark, type: image, label: Picture on a dark page}
          - {key: title, type: string, label: Caption}
          - {key: note, type: string, label: Note, help: A few words at the other end of the caption.}
          - {key: link, type: url, label: Link}

  - key: home_end
    type: section
    label: "Home page: news and more"
    preview: home
    fields:
      - key: show_news
        type: boolean
        label: Show the latest news
        help: The three newest posts.
        default: true
      - key: more_title
        type: string
        label: Closing heading
        help: A heading beside the cards at the end of the home page, such as related projects.
        placeholder: More from us
      - key: more_text
        type: text
        label: Closing text
        help: A sentence under the closing heading.
      - key: more
        type: repeat
        label: Closing cards
        help: Cards at the end of the home page, each a title and a sentence, a short note such as a status, and a link if it has one.
        fields:
          - {key: title, type: string, label: Title}
          - {key: text, type: text, label: Text}
          - {key: note, type: string, label: Note, placeholder: In development}
          - {key: note_quiet, type: boolean, label: Gray note, help: For something not out yet., default: false}
          - {key: link, type: url, label: Link}
          - {key: link_label, type: string, label: Link text, placeholder: Learn more}

  - key: docs
    type: section
    label: Docs
    preview: page
    fields:
      - key: show_toc
        type: boolean
        label: Show a table of contents
        help: Beside a page with at least two headings, or above it on a narrow screen.
        default: true
      - key: show_updated
        type: boolean
        label: Show when a page was last updated
        help: Under the title, taken from the page's updated_at, or its date when it has none.
        default: true
      - key: show_reading_time
        type: boolean
        label: Show the reading time
        help: How long a page takes to read, under its title.
        default: true

  - key: community
    type: section
    label: Social
    fields:
      - key: social
        type: group
        label: Social links
        help: Shown as icons in the header and the footer.
        fields:
          - {key: github, type: url, label: GitHub, placeholder: https://github.com/you/project}
          - {key: x, type: url, label: X, placeholder: https://x.com/you}
          - {key: discord, type: url, label: Discord, placeholder: https://discord.gg/invite}
          - {key: email, type: string, label: Email, placeholder: hello@example.com}

  - key: footer
    type: section
    label: Footer
    fields:
      - key: footer_columns
        type: repeat
        label: Link columns
        help: Each column is a title over a few links.
        fields:
          - {key: title, type: string, label: Column title, placeholder: Docs}
          - key: links
            type: repeat
            label: Links
            fields:
              - {key: label, type: string, label: Label}
              - {key: url, type: url, label: Address}
      - key: copyright
        type: string
        label: Copyright
        help: Left empty, the site is credited to itself for the year it was last built.
