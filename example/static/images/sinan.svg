    .tick { stroke: #3d65bd; stroke-opacity: .4; stroke-width: 2; stroke-linecap: round; }
    .tick.major { stroke-opacity: .75; stroke-width: 3; }
    .shine { fill: #ffffff; fill-opacity: .38; }
