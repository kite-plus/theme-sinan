# What Vane says about itself in the admin, in Chinese. The keys follow
# theme.yaml; anything missing here is shown as written there.
theme:
  title: 风标
  description: 为产品文档、项目官网和知识库设计的文档主题，黑白灰加细线。首页、按顺序排列的文档目录、页内目录和新闻，支持浅色与深色，不从第三方加载任何资源。

  settings:
    brand:
      label: 品牌
    logo:
      label: 标志
      help: 显示在页头的站点标题前。建议使用 SVG，或高约 64 像素的图片。
    show_title:
      label: 在标志旁显示站点标题
      help: 标志里已经写着名字时可以关掉。
    favicon:
      label: 站点图标
      help: 显示在浏览器标签页和书签里。建议使用至少 64 像素的正方形图片。
    accent:
      label: 强调色
      help: 用于链接的下划线、键盘焦点和搜索结果里的高亮。按钮和当前页保持黑白。深色模式下主题会自动调亮。
      options:
        "#3d65bd": 风筝蓝
        "#0f766e": 青绿
        "#6d4fc2": 紫罗兰
        "#b4530e": 赭橙
    color_scheme:
      label: 浅色或深色
      help: 读者第一次看到的样子，之后仍可以用页头的按钮切换。
      options:
        auto: 跟随读者的系统
        light: 浅色
        dark: 深色

    navigation:
      label: 导航
    nav:
      label: 页头链接
      help: 站内地址以斜杠开头；指向其他网站的链接在新标签页打开。
      fields:
        label:
          label: 名称
          placeholder: 指南
        url:
          label: 地址
    button_label:
      label: 页头按钮
      help: 页头最右边的黑色按钮，例如下载链接。留空就不显示。
      placeholder: 下载
    button_url:
      label: 页头按钮地址
    sidebar:
      label: 文档目录
      help: 侧栏里的分组和每组的页面，按阅读顺序排列。列在这里的页面旁边会显示目录，它的上一页、下一页也按这个顺序。
      fields:
        title:
          label: 分组标题
          placeholder: 开始
        pages:
          label: 页面
          fields:
            label:
              label: 标题
              placeholder: 介绍
            url:
              label: 地址

    notice:
      label: 公告栏
    announcement:
      label: 显示公告栏
      help: 每个页面页头上方的一行字，适合发布新版本或活动时使用。
    announcement_text:
      label: 文字
      placeholder: 1.0 版已发布
    announcement_link:
      label: 链接
      help: 留空时公告栏不是链接。

    home:
      label: 首页
    badge_text:
      label: 标签条
      help: 标题上方的一行短句，例如新版本发布的消息。留空就不显示。
      placeholder: 第一个版本发布了
    badge_tag:
      label: 标签
      help: 标签条开头的黑底小字，例如版本号。
    badge_link:
      label: 标签条链接
      help: 留空时标签条不是链接。
    hero_title:
      label: 标题
      help: 留空时使用站点标题。
    hero_text:
      label: 标语
      help: 标题下的一两句话。留空时使用站点描述。
    actions:
      label: 按钮
      help: 第一个是黑色的主按钮。留空时首页链接到文档目录的第一页。
      fields:
        label:
          label: 文字
          placeholder: 开始阅读
        url:
          label: 地址
    hero_command:
      label: 命令
      help: 显示在按钮旁、读者可以一键复制的命令，例如安装产品的命令。
    hero_image:
      label: 配图
      help: 产品的宽幅截图，加边框显示在标题下方。
    hero_image_dark:
      label: 深色时的配图
      help: 页面是深色时换成这张。留空时深浅色都用上面那张。
    features_title:
      label: 特性标题
      help: 特性上方的小标题。
      placeholder: 能做什么
    features:
      label: 特性
      help: 标题下方的格子，按顺序编号，每格一个标题和一句话，填了链接就能点。
      fields:
        title:
          label: 标题
        text:
          label: 文字
        link:
          label: 链接
    show_news:
      label: 显示最新动态
      help: 在特性下面列出最新的三篇文章。
    more_title:
      label: 末尾标题
      help: 首页末尾那一列的小标题，例如相关项目。
      placeholder: 更多
    more_text:
      label: 末尾说明
      help: 末尾标题下的一句话。
    more:
      label: 末尾列表
      help: 首页末尾的几行，每行一个标题和一句话，可以附一条简短的备注（例如状态），填了链接就能点。
      fields:
        title:
          label: 标题
        text:
          label: 文字
        note:
          label: 备注
          placeholder: 开发中
        link:
          label: 链接

    docs:
      label: 文档
    show_toc:
      label: 显示页内目录
      help: 有两个以上小标题的页面会在旁边显示目录，窄屏时显示在正文上方。
    show_updated:
      label: 显示最后更新时间
      help: 显示在标题下方，取页面的 updated_at，没有时取它的日期。
    show_reading_time:
      label: 显示阅读时间
      help: 在标题下方显示读完这一页大约要多久。

    community:
      label: 社交
    social:
      label: 社交链接
      help: 以图标显示在页头和页脚。
      fields:
        email:
          label: 邮箱

    footer:
      label: 页脚
    footer_columns:
      label: 链接栏
      help: 每一栏是一个标题加几条链接。
      fields:
        title:
          label: 栏目标题
          placeholder: 文档
        links:
          label: 链接
          fields:
            label:
              label: 名称
            url:
              label: 地址
    copyright:
      label: 版权信息
      help: 留空时，署名为站点本身，年份为最后一次构建的年份。

  layouts:
    wide:
      label: 宽页面
      description: 占满整个宽度，不显示文档目录和页内目录，适合不属于文档的页面。
