{{ define "main" }}
{{- $lang := .Site.Language -}}
<div class="notfound">
  <p class="notfound-code">404</p>
  <h1>{{ partial "t.html" (dict "k" "notfound" "lang" $lang) }}</h1>
  <p>{{ partial "t.html" (dict "k" "notfound_body" "lang" $lang) }}</p>
  <p><a class="button primary" href="{{ url.For "home" }}">{{ partial "t.html" (dict "k" "back_home" "lang" $lang) }}</a></p>
</div>
{{ end }}
